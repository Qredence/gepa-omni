[project]
name = "qredence-optimization-marketplace"
version = "0.1.0"
description = "Developer tooling and tests for the Qredence optimization plugin marketplace."
requires-python = ">=3.10"
dependencies = []

# GEPA's latest upstream main is used while the parallel-proposal API is ahead
# of the newest published release. The lockfile records the exact revision used
# by CI; refresh it intentionally when moving to a newer upstream revision.

[dependency-groups]
dev = [
    "coverage[toml]>=7.0",
    "pytest>=8.0",
    "ruff>=0.15.2",
    "gepa-omni",
    "gepa[full] @ git+https://github.com/gepa-ai/gepa.git@8a2bed96385202f69caaeb5327a843ed2f5ea225"
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "tools",
    "plugins/fleet-optimize/tests",
]
pythonpath = [
    "packages/gepa-omni/src",
    "plugins/fleet-optimize/skills/gepa-omni-skill/scripts",
    "plugins/fleet-optimize/skills/fleet-optimize-skill/scripts",
    "tools",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
package = false
override-dependencies = ["cryptography>=50.0.0"]

[tool.uv.sources]
gepa-omni = { path = "packages/gepa-omni" }
