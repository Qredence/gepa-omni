[project]
name = "gepa-omni"
version = "0.1.0"
description = "Developer tooling and tests for the GEPA Omni plugin."
requires-python = ">=3.10"
dependencies = []

# The plugin targets the published GEPA 0.1.4 API for reflective GEPA. The
# AutoResearch, Meta-Harness, and Best-of-N runtimes ship in the skill itself.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.2",
    "gepa[full]==0.1.4"
]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["skills/gepa-omni-skill/scripts", "tools"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.uv]
package = false
override-dependencies = ["cryptography>=50.0.0"]
